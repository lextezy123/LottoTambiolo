[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
activityCompose = "1.10.1"
lifecycle = "2.8.6"
composeBom = "2024.10.00"
serialization = "1.7.3"
datastore = "1.1.1"
playAds = "23.4.0"
billing = "8.0.0"
fragment = "1.8.6"
playReview = "2.0.2"
ump = "3.1.0"
work = "2.9.1"
junit = "4.13.2"

[libraries]
ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
