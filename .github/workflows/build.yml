name: Build and test

# Runs on every push and pull request: unit tests, a debug build, and a release
# build (unsigned) so code-shrinking problems show up here, not on a phone.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug build, release build (unsigned)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log
      - name: Show errors in the run summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### Build errors"
            echo '```'
            grep -E "^e: |^FAILURE|What went wrong|FAILED|error:|Test.*FAILED|AssertionError" build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tambiolo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
          retention-days: 7
